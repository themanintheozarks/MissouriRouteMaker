<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Missouri Route Maker</title>

    <meta
        name="theme-color"
        content="#2563eb">

    <meta
        name="description"
        content="Offline-first Missouri route planning application">

    <link
        rel="manifest"
        href="manifest.json">

    <!-- MapLibre -->

    <link
        href="https://unpkg.com/maplibre-gl@5.8.1/dist/maplibre-gl.css"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/app.css">

</head>

<body>

<div id="app">

    <header id="app-header">

        <h1 id="app-title">
            Missouri Route Maker
        </h1>

        <button
            id="menu-button"
            aria-label="Menu">

            ☰

        </button>

    </header>

    <main id="main-content">

        <div id="map-container">

            <div id="map"></div>

        </div>

        <div id="gps-status">

            GPS Not Connected

        </div>

        <div id="popup-container"></div>

        <div id="toast-container"></div>

        <div id="loading-overlay" class="hidden">

            <div id="loading-spinner"></div>

            <p>Loading...</p>

        </div>

        <div id="zoom-controls">

            <button id="zoom-in">+</button>

            <button id="zoom-out">−</button>

        </div>

        <button
            id="gps-button"
            class="floating-button">

            📍

        </button>

        <button
            id="route-button"
            class="floating-button">

            🚗

        </button>

    </main>

    <nav id="bottom-navigation">

        <button id="nav-map">

            🗺️

            <span>Map</span>

        </button>

        <button id="nav-places">

            📍

            <span>Places</span>

        </button>

        <button id="nav-routes">

            🚗

            <span>Routes</span>

        </button>

        <button id="nav-settings">

            ⚙️

            <span>Settings</span>

        </button>

    </nav>

    <section id="bottom-sheet">

        <div id="bottom-sheet-content"></div>

    </section>

</div>

<!-- MapLibre -->

<script
    src="https://unpkg.com/maplibre-gl@5.8.1/dist/maplibre-gl.js">
</script>

<!-- Application -->

<script type="module" src="js/app.js"></script>

</body>
</html>
