<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Missouri Route Maker</title>
    
    <!-- MapLibre GL CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <link rel="stylesheet" href="./css/app.css">
</head>
<body>
    <div id="app-container">
        <!-- Navigation Header -->
        <header class="top-nav">
            <div class="brand">
                <h1>MO Route Maker</h1>
            </div>
            <div class="nav-actions">
                <button id="btn-gps" class="nav-btn gps-container" title="GPS Follow Me">
                    <span id="gps-icon">🎯</span>
                    <span id="gps-status" class="label">GPS Off</span>
                </button>
                <button id="btn-route" class="nav-btn" title="Route Builder">
                    <span>🗺️</span>
                    <span class="label">Route</span>
                </button>
                <button id="btn-places" class="nav-btn" title="Places Log">
                    <span>📍</span>
                    <span class="label">Places</span>
                </button>
                <button id="btn-import" class="nav-btn" title="Import Data">
                    <span>📥</span>
                    <span class="label">Import</span>
                </button>
                <button id="btn-settings" class="nav-btn" title="Settings">
                    <span>⚙️</span>
                    <span class="label">Settings</span>
                </button>
            </div>
        </header>

        <!-- Map Canvas -->
        <div id="map"></div>

        <!-- Slide-out Drawer / Modal Overlay Structure -->
        <div id="modal-overlay" class="overlay-hidden">
            <div id="modal-bottom-sheet" class="bottom-sheet">
                <div class="sheet-header">
                    <h2 id="modal-title">Menu</h2>
                    <button id="modal-close-btn" class="close-btn">&times;</button>
                </div>
                <div id="modal-body" class="sheet-content">
                    <!-- Dynamic Module Views Render Here -->
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
