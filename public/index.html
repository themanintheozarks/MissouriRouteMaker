<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Missouri Route Maker</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e293b">
    
    <!-- MapLibre GL CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
    
    <!-- Application Stylesheets -->
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/app.css">
</head>
<body data-theme="auto">

    <!-- Top Navigation Overlay Controls -->
    <header class="top-nav">
        <div class="brand">
            <h1>MO Route Maker</h1>
        </div>
        
        <div class="nav-actions">
            <!-- GPS Control Badge -->
            <button id="btn-gps" class="nav-btn gps-container" title="Toggle GPS Follow Mode" type="button">
                <span class="icon">🎯</span>
                <span id="gps-status" class="label">GPS Off</span>
            </button>
            
            <button id="btn-routes" class="nav-btn" type="button">
                <span class="icon">🗺️</span>
                <span class="label">Route</span>
            </button>
            
            <button id="btn-places" class="nav-btn" type="button">
                <span class="icon">📍</span>
                <span class="label">Places</span>
            </button>
            
            <button id="btn-import" class="nav-btn" type="button">
                <span class="icon">📥</span>
                <span class="label">Import</span>
            </button>
            
            <button id="btn-settings" class="nav-btn" type="button">
                <span class="icon">⚙️</span>
            </button>
        </div>
    </header>

    <!-- Map Canvas Container -->
    <main id="app-container">
        <div id="map"></div>
    </main>

    <!-- Application ES Module Loader -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
