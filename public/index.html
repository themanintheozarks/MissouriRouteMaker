<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Missouri Route Maker</title>
    
    <!-- MapLibre GL CSS & JS (v4 Stable Bundle) -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <link rel="stylesheet" href="./css/app.css">
</head>
<body>
    <div id="app-container">
        <!-- Navigation Header -->
        <header class="top-nav">
            <div class="brand">
                <h1>MO Route Maker</h1>
            </div>
            <div class="nav-actions">
                <button id="btn-gps" class="nav-btn gps-container">
                    <span id="gps-icon">🎯</span>
                    <span id="gps-status" class="label">GPS Off</span>
                </button>
                <button id="btn-route" class="nav-btn">
                    <span>🗺️</span>
                    <span class="label">Route</span>
                </button>
                <button id="btn-places" class="nav-btn">
                    <span>📍</span>
                    <span class="label">Places</span>
                </button>
                <button id="btn-import" class="nav-btn">
                    <span>📥</span>
                    <span class="label">Import</span>
                </button>
                <button id="btn-settings" class="nav-btn">
                    <span>⚙️</span>
                    <span class="label">Settings</span>
                </button>
            </div>
        </header>

        <!-- Map Container Canvas -->
        <div id="map"></div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
